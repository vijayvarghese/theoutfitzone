server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Performance & caching
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression for media and text
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types image/svg+xml text/plain application/json;

    # Health check endpoint for Docker container
    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Serve uploaded product images
    location /products/ {
        alias /usr/share/nginx/html/products/;
        autoindex off;

        # CORS headers so main storefront can embed or fetch images freely
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Cache headers for high performance
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        etag on;

        try_files $uri =404;
    }

    # Fallback default
    location / {
        return 404 "Not Found\n";
    }
}
