name: Build and Publish Docker Images

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: shop-api
            context: ./shop-api
            image: ghcr.io/${{ github.repository_owner }}/shop-api
          - service: web
            context: ./web
            image: ghcr.io/${{ github.repository_owner }}/shop-web
          - service: inventory-portal
            context: ./inventory-portal
            image: ghcr.io/${{ github.repository_owner }}/shop-inventory-portal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Image Name
        id: image-name
        run: |
          echo "IMAGE_NAME=$(echo '${{ matrix.image }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.image-name.outputs.IMAGE_NAME }}:latest
            ${{ steps.image-name.outputs.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
