services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: shop
      TZ: Asia/Kolkata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 5s
      retries: 10

  nocodb:
    image: nocodb/nocodb:latest
    restart: unless-stopped
    environment:
      NC_ALLOW_LOCAL_EXTERNAL_DBS: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"   # local access only; remote access comes later via Cloudflare Tunnel
    volumes:
      - nocodb_data:/usr/app/data

  shop-api:
    build: ./shop-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://shop:${DB_PASS}@db:5432/shop
      API_KEY: ${API_KEY}
      ORDER_PREFIX: DS
      RESERVATION_MINUTES: "30"
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      shop-api:
        condition: service_healthy
      nginx-media:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:3000"
    volumes:
      - ./web/content:/app/content
      - ./media-uploads:/app/public/products
    environment:
      SHOP_API_URL: http://shop-api:3000
      SHOP_API_KEY: ${API_KEY}
      NGINX_MEDIA_HOST: nginx-media
      NGINX_MEDIA_PORT: "80"
      SESSION_SECRET: ${SESSION_SECRET:-super-secret-session-key-at-least-32-characters-long}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-atelier-secret-admin}
      STORE_NAME: ${STORE_NAME:-Aura & Thread Atelier}
      STORE_TAGLINE: ${STORE_TAGLINE:-Handcrafted Indian silhouettes woven for graceful modern living.}
      SITE_URL: ${SITE_URL:-http://localhost:8081}
      UPI_VPA: ${UPI_VPA:-aurathread@okaxis}
      UPI_PAYEE_NAME: ${UPI_PAYEE_NAME:-Aura and Thread Atelier}
      WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:-919876543210}
      INSTAGRAM_HANDLE: ${INSTAGRAM_HANDLE:-aurathread.atelier}
      CONTACT_PHONE: ${CONTACT_PHONE:-+91 98765 43210}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-concierge@aurathread.com}
      STORE_ADDRESS: ${STORE_ADDRESS:-42, Khader Nawaz Khan Road, Nungambakkam, Chennai 600006}
      STORE_HOURS: "${STORE_HOURS:-Mon - Sat: 10:30 AM - 8:00 PM | Sun: 11:30 AM - 6:00 PM}"
      MAPS_URL: ${MAPS_URL:-https://maps.google.com/?q=Chennai}
      SHIPPING_FLAT: ${SHIPPING_FLAT:-100}
      FREE_SHIPPING_ABOVE: ${FREE_SHIPPING_ABOVE:-2500}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Dedicated Nginx service serving media images with high-performance caching & CORS to the main website
  nginx-media:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:80"
    volumes:
      - ./media-uploads:/usr/share/nginx/html/products:ro
      - ./nginx-media.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s

  # Dedicated Store Staff Inventory Management Service (Direct Postgres Connection, Zero Storefront coupling)
  inventory-portal:
    build: ./inventory-portal
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      nginx-media:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:3000"
    volumes:
      - ./media-uploads:/app/uploads
    environment:
      DATABASE_URL: postgres://shop:${DB_PASS}@db:5432/shop
      PORT: "3000"
      STORE_NAME: ${STORE_NAME:-Aura & Thread Atelier}
      PUBLIC_MEDIA_URL: /products
      NGINX_PREVIEW_URL: http://localhost:8083
      AUTH_USER_OWNER: ${AUTH_USER_OWNER:-owner:owner123}
      AUTH_USER_STAFF1: ${AUTH_USER_STAFF1:-staff1:staff123}
      AUTH_USER_STOCK_ADDER: ${AUTH_USER_STOCK_ADDER:-stock_adder:stock123}
      SESSION_SECRET: ${PORTAL_SESSION_SECRET:-inventory-portal-super-secret-key-at-least-32-chars}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
  nocodb_data:
